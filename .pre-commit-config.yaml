# Configuração do pre-commit — https://pre-commit.com
#
#   make hooks          instala os hooks (commit e push) neste clone
#   make lint           roda todos os hooks de commit em todos os arquivos
#   make hooks-update   atualiza as versões (`rev`) abaixo para as mais recentes
minimum_pre_commit_version: "3.2.0"

# `pre-commit install` passa a instalar também o hook de pre-push (testes)
default_install_hook_types: [pre-commit, pre-push]

# Arquivos gerados ou baixados não devem ser reescritos pelos hooks
exclude: ^src/wiki/static/(css/pygments\.css|vendor/)

repos:
  # ---------------------------------------------------------------- higiene e sintaxe
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]  # preserva quebra de linha com dois espaços no Markdown
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--unsafe]                     # mkdocs.yml usa tags como !!python/name (só valida a sintaxe)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: debug-statements                 # breakpoint(), pdb.set_trace()…
      # segurança
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]

  # ---------------------------------------------------------------- lint e formatação
  # A configuração das regras está em [tool.ruff] no pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---------------------------------------------------------------- lockfile do uv
  # Mantém o uv.lock em sincronia sempre que o pyproject.toml muda.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.0
    hooks:
      - id: uv-lock

  # ---------------------------------------------------------------- hooks locais
  # Rodam no ambiente do projeto (`uv run`), onde flask, markdown-it-py etc. estão instalados.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run --locked mypy
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false                # a lista de arquivos vem de [tool.mypy] no pyproject

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]                   # lento demais para todo commit
