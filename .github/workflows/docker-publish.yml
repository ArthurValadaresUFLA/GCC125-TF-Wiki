name: Build, Push e Release

on:
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # nunca interrompe uma publicação em andamento

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint, testes e build do pacote (python-package.yml). Sem isso, nada é publicado.
  ci:
    name: CI
    uses: ./.github/workflows/python-package.yml

  build-and-push-image:
    name: Build, teste e push da imagem
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write # criar o release e a tag
      packages: write # publicar no GHCR

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Extrair versão do pyproject.toml
        id: extract_version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão detectada: $VERSION"

      # Uma versão só vira release (e tag de imagem) uma vez. Para publicar outra,
      # incremente `version` no pyproject.toml.
      - name: Verificar se a versão já foi publicada
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "A versão $VERSION já tem release: só as tags latest e sha serão atualizadas."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "Versão $VERSION nova: a imagem e o release serão criados."
          fi

      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no Container Registry (GHCR)
        if: ${{ !env.ACT }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (Tags e Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.extract_version.outputs.version }},enable=${{ steps.release_check.outputs.is_new == 'true' }}
            type=sha

      # 1) Constrói a imagem só localmente, para testá-la antes de publicar.
      - name: Build da imagem (local, para teste)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: wiki:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sobe o container com as mesmas restrições do docker-compose.yml
      # (somente leitura, sem privilégios) e confere as rotas e o tema embutido.
      - name: Teste de fumaça da imagem
        run: |
          docker run -d --name wiki-smoke -p 5000:5000 \
            -v "$PWD/examples/content:/app/data:ro" \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            wiki:smoke
          BASE=http://127.0.0.1:5000
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused "$BASE/" > /dev/null
          curl --fail --silent --show-error "$BASE/bem-vindo" | grep -q "Bem-vindo"
          curl --fail --silent --show-error "$BASE/bem-vindo/pdf" | grep -q "data-autoprint"
          curl --fail --silent --show-error --head "$BASE/dados/vendas.csv" | grep -qi "content-disposition: attachment"
          curl --fail --silent --show-error --head "$BASE/_static/vendor/pico.classless.min.css"

      - name: Logs do container (em caso de falha)
        if: failure()
        run: docker logs wiki-smoke

      - name: Parar o container de teste
        if: always()
        run: docker rm --force wiki-smoke

      # 2) Reaproveita as camadas do passo 1 (cache) e publica.
      - name: Push da imagem Docker
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Criar Release no GitHub
        if: ${{ !env.ACT }} && steps.release_check.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.extract_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
